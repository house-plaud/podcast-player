<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Podcast Player</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="player.js"></script>
</head>
<body>
  <header class="top">
    <a class="nav-back" href="./">‹ 全部剧集</a>
    <p class="kicker"><span id="ep-meta">加载中…</span> · <a id="source" target="_blank" rel="noopener">原文</a></p>
    <h1 id="ep-title"></h1>
  </header>

  <main id="transcript" aria-live="off"></main>

  <button id="follow" class="follow" hidden>↓ 回到当前位置</button>
  <div id="gloss" class="gloss" role="tooltip" hidden></div>

  <footer class="player">
    <audio id="audio" preload="metadata"></audio>
    <p id="sub" class="sub" lang="zh-CN" hidden></p>
    <div id="prefs" class="prefs" hidden>
      <label><input type="checkbox" id="pref-sub"> 底部中文字幕</label>
      <label><input type="checkbox" id="pref-gloss"> 长按 / 悬停句子看译文</label>
      <p id="prefs-note" class="note" hidden></p>
    </div>
    <div class="progress">
      <span id="cur" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="播放进度">
      <span id="dur" class="time">0:00</span>
    </div>
    <div class="controls">
      <button id="rate" class="rate" aria-label="播放速度">1x</button>
      <button id="back" aria-label="后退 15 秒">↺ 15</button>
      <button id="play" class="play" aria-label="播放">▶</button>
      <button id="fwd" aria-label="前进 15 秒">15 ↻</button>
      <button id="zh" class="zh" aria-label="中文译文设置" aria-expanded="false">译</button>
    </div>
  </footer>
</body>
</html>
